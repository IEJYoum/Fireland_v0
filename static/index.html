<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fireland 3D Foundation</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="Fireland 3D world"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="hit-marker" aria-hidden="true">×</div>
      <section id="hud" aria-label="Player status">
        <strong>FIRELAND</strong>
        <div id="vitals"></div>
        <div id="equipment"></div>
      </section>
      <section id="inventory-panel" aria-label="Inventory">
        <strong>INVENTORY // Q CYCLE // F EAT</strong>
        <div id="inventory"></div>
      </section>
      <section id="messages-panel" aria-live="polite">
        <strong>MESSAGES</strong>
        <div id="messages"></div>
      </section>
      <section id="dev-panel" aria-label="Development status">
        <strong>WORLD // DEV</strong>
        <div id="position"></div>
        <div id="world-status"></div>
        <div id="connection">Connecting...</div>
      </section>
      <section id="camera-panel" aria-label="Camera controls">
        <button type="button" data-camera="first">1 First person</button>
        <button type="button" data-camera="top">2 Top debug</button>
        <button type="button" data-camera="side">3 Side debug</button>
      </section>
      <section id="start-overlay">
        <div>
          <h1>Fireland</h1>
          <p>Click to capture the mouse</p>
          <p>WASD move · Space jump · Click attack · E interact/open · Q cycle weapon · F eat · R respawn · 1/2/3 cameras</p>
        </div>
      </section>
    </main>
    <script type="module" src="/static/main.js"></script>
  </body>
</html>
