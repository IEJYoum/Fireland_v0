<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game RPG</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main>
      <h1>Room prototype</h1>
      <div id="game-frame">
        <canvas id="game" aria-label="Game room"></canvas>
        <section id="game-over" hidden aria-live="assertive">
          <div>
            <h2>Game over</h2>
            <button id="play-again" type="button">Play again</button>
          </div>
        </section>
      </div>
      <section id="status" aria-live="polite"></section>
      <p class="help">WASD: move · E: pick up/open door · 1: equip/cycle weapons · Click: fire</p>
    </main>
    <script src="/static/cosmetics.js"></script>
    <script src="/static/game.js"></script>
  </body>
</html>
